---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  <p class="post-meta">
    {{ page.date | date: "%d %B %Y" }}
    {%- if page.reading_time %} · {{ page.reading_time }}{% endif %}
    {%- if page.tags.size > 0 %} · {{ page.tags | join: " / " }}{% endif %}
  </p>

  <div class="post-body">
    {{ content }}
  </div>

  <a class="back" href="{{ '/writing/' | relative_url }}">← All writing</a>
</article>
